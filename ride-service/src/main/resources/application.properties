# =========================================================
# Ride Service - fare estimation & ride lifecycle
# =========================================================
spring.application.name=ride-service
server.port=8081

# ---------- Database ----------
spring.datasource.url=jdbc:postgresql://localhost:5432/ride_db
spring.datasource.username=uber
spring.datasource.password=uber
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- Keycloak (JWT validation) ----------
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/uber-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/uber-realm/protocol/openid-connect/certs

# ---------- Google Maps ----------
google.maps.api-key=${GOOGLE_MAPS_API_KEY:AIzaSyDuLZRiFezfvA8Qs1HT1IepR_lAQB7yXvg}

# ---------- Redis (surge pricing sliding window) ----------
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ---------- Surge pricing ----------
uber.surge.enabled=true
uber.surge.window-seconds=60

# ---------- Pricing model ----------
uber.pricing.base-fare=2.50
uber.pricing.per-km=1.75
uber.pricing.per-minute=0.30
uber.pricing.currency=USD

# ---------- Downstream services ----------
uber.services.matching-url=http://localhost:8083
uber.services.payments-url=http://localhost:8086

# ---------- Kafka (event bus) ----------
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=ride-service

# ---------- Actuator + Prometheus ----------
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}

# ---------- OpenAPI ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
