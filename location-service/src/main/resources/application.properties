# =========================================================
# Location Service - real-time driver GEO tracking (Redis)
# =========================================================
spring.application.name=location-service
server.port=8082

# ---------- Redis ----------
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ---------- Keycloak (JWT validation) ----------
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/uber-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/uber-realm/protocol/openid-connect/certs

# ---------- Location rules ----------
uber.location.online-ttl-seconds=60
uber.location.stale-threshold-seconds=60
uber.location.cleanup-interval-ms=30000

# ---------- Actuator + Prometheus ----------
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
