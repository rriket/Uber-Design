version: "3.9"

# ============================================================
# Uber Clone - Local Development Stack
# ------------------------------------------------------------
# All backing services (Postgres, Redis, Keycloak) run in
# containers. The Spring Boot microservices are meant to be
# started from IntelliJ (Run configurations) or via ./mvnw
# so you can enjoy hot-reload, breakpoints, etc.
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: uber-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: uber
      POSTGRES_PASSWORD: uber
      POSTGRES_MULTIPLE_DATABASES: "ride_db,ratings_db,payments_db,keycloak_db,temporal,temporal_visibility"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uber"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: uber-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: uber-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: uber
      KC_DB_PASSWORD: uber
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  # ============================================================
  # Temporal - durable workflow orchestrator for matching-service
  # ============================================================
  temporal:
    image: temporalio/auto-setup:1.24
    container_name: uber-temporal
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: uber
      POSTGRES_PWD: uber
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"          # gRPC endpoint (matching-service worker connects here)
    depends_on:
      postgres:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:2.27.2
    container_name: uber-temporal-ui
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8233:8080"          # Temporal Web UI — inspect running workflows
    depends_on:
      - temporal

  # ============================================================
  # Observability - Prometheus + Grafana (free OSS)
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: uber-prometheus
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: uber-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"          # Grafana UI (:3000 is reserved for the React app)
    depends_on:
      - prometheus

  # ============================================================
  # Kafka - event bus (KRaft mode, no Zookeeper needed)
  # ============================================================
  kafka:
    image: bitnami/kafka:3.7
    container_name: uber-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"    # host access (from services running on host)
      - "9094:9094"    # docker-internal
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:9094"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092,INTERNAL://kafka:9094"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: uber-kafka-ui
    restart: unless-stopped
    ports:
      - "8090:8080"          # Kafka Web UI — inspect topics & events
    environment:
      KAFKA_CLUSTERS_0_NAME: "uber-clone"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9094"
    depends_on:
      - kafka

volumes:
  postgres_data:
  redis_data:
  grafana_data:
