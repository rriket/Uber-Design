# =========================================================
# Ratings Service - post-ride ratings for rider & driver
# =========================================================
spring.application.name=ratings-service
server.port=8085

# ---------- Database ----------
spring.datasource.url=jdbc:postgresql://localhost:5432/ratings_db
spring.datasource.username=uber
spring.datasource.password=uber
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ---------- Keycloak ----------
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/uber-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/uber-realm/protocol/openid-connect/certs

# ---------- Actuator + Prometheus ----------
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
