# =========================================================
# Payments Service - Stripe-backed ride charges + earnings
# =========================================================
spring.application.name=payments-service
server.port=8086

# ---------- Database ----------
spring.datasource.url=jdbc:postgresql://localhost:5432/payments_db
spring.datasource.username=uber
spring.datasource.password=uber
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ---------- Keycloak ----------
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/uber-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/uber-realm/protocol/openid-connect/certs

# ---------- Stripe ----------
# Provide via env var STRIPE_API_KEY. If blank, charges are MOCKED (recorded in DB, no real Stripe call).
# Get a free test key at https://dashboard.stripe.com/test/apikeys (starts with sk_test_...)
stripe.api-key=${STRIPE_API_KEY:}
stripe.test-payment-method=${STRIPE_TEST_PAYMENT_METHOD:pm_card_visa}
stripe.enabled=true

# ---------- Fare split ----------
uber.payments.driver-share=0.80

# ---------- Kafka (event bus) ----------
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=payments-service

# ---------- Actuator + Prometheus ----------
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
