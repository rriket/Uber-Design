# =========================================================
# API Gateway - routes all client traffic to microservices
# =========================================================
spring.application.name=api-gateway
server.port=8080

# ---------- Route definitions ----------
spring.cloud.gateway.discovery.locator.enabled=false

# Ride Service - fare estimate, ride creation, accept/decline
spring.cloud.gateway.routes[0].id=ride-service
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/fares/**,/api/rides/**

# Location Service - driver location updates, nearby search
spring.cloud.gateway.routes[1].id=location-service
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/locations/**

# Matching Service - internal driver-rider matching
spring.cloud.gateway.routes[2].id=matching-service
spring.cloud.gateway.routes[2].uri=http://localhost:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/matching/**

# Notification Service - REST + WebSocket to driver clients
spring.cloud.gateway.routes[3].id=notification-service-http
spring.cloud.gateway.routes[3].uri=http://localhost:8084
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/notifications/**

spring.cloud.gateway.routes[4].id=notification-service-ws
spring.cloud.gateway.routes[4].uri=ws://localhost:8084
spring.cloud.gateway.routes[4].predicates[0]=Path=/ws/**

# Ratings Service - post-ride ratings
spring.cloud.gateway.routes[5].id=ratings-service
spring.cloud.gateway.routes[5].uri=http://localhost:8085
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/ratings/**

# Payments Service - Stripe-backed charges & driver earnings
spring.cloud.gateway.routes[6].id=payments-service
spring.cloud.gateway.routes[6].uri=http://localhost:8086
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/payments/**

# ---------- OAuth2 / Keycloak ----------
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/uber-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/uber-realm/protocol/openid-connect/certs

# ---------- Actuator + Prometheus ----------
management.endpoints.web.exposure.include=health,info,gateway,prometheus
management.endpoint.gateway.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}

# ---------- Logging ----------
logging.level.org.springframework.cloud.gateway=INFO
logging.level.reactor.netty.http.client=INFO
