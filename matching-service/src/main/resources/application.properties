# =========================================================
# Matching Service - Temporal-backed workflow orchestrator
# =========================================================
spring.application.name=matching-service
server.port=8083

# ---------- Redis (distributed lock) ----------
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ---------- Temporal ----------
temporal.target=127.0.0.1:7233
temporal.namespace=default

# ---------- Keycloak (JWT validation) ----------
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/uber-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/uber-realm/protocol/openid-connect/certs

# ---------- Matching rules ----------
uber.matching.acceptance-window-seconds=10
uber.matching.max-candidates=10
uber.matching.search-radius-km=5

# ---------- Downstream services ----------
uber.services.ride-url=http://localhost:8081
uber.services.location-url=http://localhost:8082
uber.services.notification-url=http://localhost:8084

# ---------- Kafka (event bus) ----------
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=matching-service

# ---------- Actuator + Prometheus ----------
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
