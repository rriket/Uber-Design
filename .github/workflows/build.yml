name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ==============================================
  # Backend — Maven multi-module build
  # ==============================================
  backend:
    name: Backend (mvn verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '26'
          cache: 'maven'

      - name: Build & verify all modules
        run: ./mvnw -B -DskipTests=false verify

      - name: Upload Spring Boot JARs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-jars
          path: '**/target/*.jar'
          retention-days: 7

  # ==============================================
  # Frontend — React production build
  # ==============================================
  frontend:
    name: Frontend (yarn build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Production build
        # CI=true turns eslint warnings into errors, matching what the deploy build sees.
        run: CI=true yarn build

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build
          retention-days: 7

  # ==============================================
  # Aggregate status — required for branch protection
  # ==============================================
  ci-success:
    name: CI success
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All checks passed."
